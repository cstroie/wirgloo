name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload binaries

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux,   goarch: amd64, cgo: '0'}
          - {goos: linux,   goarch: arm64, cgo: '0'}
          - {goos: darwin,  goarch: amd64, cgo: '1'}
          - {goos: darwin,  goarch: arm64, cgo: '1'}
          - {goos: windows, goarch: amd64, cgo: '1'}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          go build -ldflags "-X main.version=${GITHUB_REF_NAME}" \
            -o wirgloo-${GOOS}-${GOARCH}${EXT} \
            ./cmd/wirgloo

      - name: Install nfpm
        if: matrix.goos == 'linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # tar.gz with install.sh + service files, and deb/rpm/apk packages.
      - name: Package
        if: matrix.goos == 'linux'
        run: packaging/build.sh ${{ matrix.goarch }} ${GITHUB_REF_NAME}

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            wirgloo-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }}
            dist/*
